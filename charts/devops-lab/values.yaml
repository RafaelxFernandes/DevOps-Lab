replicaCount: 2

image:
  repository: ghcr.io/rafaelxfernandes/devops-lab
  tag: "1.2.0"                 # ← THE line that changes on every release
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

containerPort: 5000

service:
  type: LoadBalancer
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi