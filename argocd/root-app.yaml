# The "root" Application (app-of-apps pattern).
# Applied ONCE by scripts/bootstrap.sh. It deploys every file in argocd/apps/,
# so adding or removing an app = adding or removing a file there + merge.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rafaelxfernandes/DevOps-Lab.git
    targetRevision: main
    path: argocd/apps            # a plain folder of Application manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd            # Applications live in Argo CD's namespace

  syncPolicy:
    automated:
      prune: true                # file removed from argocd/apps → Application removed
      selfHeal: true
