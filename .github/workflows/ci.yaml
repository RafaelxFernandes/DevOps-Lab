name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]              # NEW: also run when you push a tag like v1.0.0
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t devops-lab:ci .
      - run: docker run --rm devops-lab:ci pytest -v

  # ---------- Job: deploy to a throwaway Kubernetes cluster ----------
  k8s-test:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Build image and load it into the cluster
        run: |
          docker build -t devops-lab:ci .
          kind load docker-image devops-lab:ci --name ci

      - name: Lint chart
        run: helm lint charts/devops-lab

      - name: Deploy with Helm (using the image we just built)
        run: |
          helm upgrade --install devops-lab charts/devops-lab \
            --namespace devops-lab --create-namespace \
            --set image.repository=devops-lab \
            --set image.tag=ci \
            --set service.type=ClusterIP \
            --wait --timeout 2m

      - name: Smoke test
        run: |
          kubectl port-forward -n devops-lab svc/devops-lab 8080:8080 &
          sleep 3
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/

      - name: Debug info (only if something failed)
        if: failure()
        run: |
          kubectl get all -n devops-lab
          kubectl describe pods -n devops-lab
          kubectl logs -n devops-lab deploy/devops-lab --all-containers --tail=50 || true

  # ---------- Job: publish the image to ghcr.io ----------
  publish:
    runs-on: ubuntu-latest
    needs: [docker, k8s-test]
    if: github.event_name != 'pull_request'   # never publish from PRs

    permissions:
      contents: read       # to check out the code
      packages: write      # to push to ghcr.io

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta                                  # lets later steps read this step's outputs
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha                    # reuse layers from previous runs
          cache-to: type=gha,mode=max
  
  # ---------- Job: open a PR that deploys the new version ----------
  bump-version:
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')    # only for releases (v* tags)

    permissions:
      contents: write          # push a branch
      pull-requests: write     # open a PR

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main            # edit the CURRENT main, not the tagged commit

      - name: Update chart to the new version
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"          # v1.4.0 → 1.4.0
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"       # share with later steps
          yq -i '.image.tag = strenv(VERSION)' charts/devops-lab/values.yaml
          yq -i '.appVersion = strenv(VERSION)' charts/devops-lab/Chart.yaml
          git diff                                       # show the change in the logs

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # lets the gh CLI authenticate
        run: |
          BRANCH="release/deploy-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "Deploy $VERSION"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Deploy $VERSION" \
            --body "Automated bump after release $GITHUB_REF_NAME. Merging this PR deploys $VERSION."