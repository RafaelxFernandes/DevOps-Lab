name: CI

# When does this run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the UI

jobs:
  # ---------- Job 1: run the tests with plain Python ----------
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]   # runs the job once per version

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip                          # reuses downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  # ---------- Job 2: build the Docker image and test inside it ----------
  docker:
    runs-on: ubuntu-latest
    needs: test                # only runs if ALL "test" jobs passed

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t devops-lab:ci .

      - name: Run tests inside the container
        run: docker run --rm devops-lab:ci pytest -v